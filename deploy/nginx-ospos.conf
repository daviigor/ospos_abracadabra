server {
    listen 127.0.0.1:8084;
    server_name sys.severinus.com.br;

    root /var/www/ospos/public;
    index index.php;

    access_log /var/log/nginx/ospos-access.log;
    error_log  /var/log/nginx/ospos-error.log;
    client_max_body_size 20M;

    # Arquivos sensiveis
    location ~ /\.(env|git|htaccess) { deny all; return 404; }
    location ~ ^/(writable|app|vendor|tests|node_modules)/ { deny all; return 404; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
    }
}
